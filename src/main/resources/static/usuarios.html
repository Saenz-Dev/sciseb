<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios · Casos SIUCE</title>
<link rel="stylesheet" href="css/estilos.css">
<script src="js/jquery.min.js"></script>
<script src="js/sesion.js"></script>
<script src="js/api.js"></script>
<script src="js/formato.js"></script>
<script src="js/ui.js"></script>
<script src="js/catalogos.js"></script>
</head>
<body>
<header class="cab" id="cab"></header>

<main class="contenedor">
  <div class="titulo-pag"><div><h1>Usuarios</h1><p class="mut" style="margin: 0">Cuentas de las áreas que usan el sistema.</p></div></div>
  <div id="alerta-error" class="alerta a-bad" role="alert" hidden></div>

  <div id="alerta-clave-temporal" class="alerta a-warn" role="status" hidden>
    <b>Clave temporal de <span id="ct-nombre"></span>:</b>
    <div style="margin: .5rem 0"><span class="clave-temp" id="ct-clave"></span></div>
    <p class="peq" style="margin: 0 0 .5rem">Entréguela por un medio seguro. <b>No se volverá a mostrar</b>; la persona deberá cambiarla en su primer ingreso.</p>
    <div class="acciones"><button class="btn btn-chico" id="btn-copiar-clave">Copiar</button><button class="btn btn-chico" id="btn-cerrar-clave">Ya la entregué</button></div>
  </div>

  <section class="card">
    <h2>Crear usuario</h2>
    <form class="grid g4" id="form-usuario" style="align-items: start" novalidate>
      <div class="campo" id="campo-nombre">
        <label for="u-nombre">Nombre completo <span class="req">*</span></label>
        <input id="u-nombre" maxlength="120">
        <div class="msg-error" hidden></div>
      </div>
      <div class="campo" id="campo-correo">
        <label for="u-correo">Correo <span class="req">*</span></label>
        <input id="u-correo" type="email" maxlength="120">
        <div class="msg-error" hidden></div>
      </div>
      <div class="campo" id="campo-areaId">
        <label for="u-area">Área <span class="req">*</span></label>
        <select id="u-area"><option value="">Seleccione…</option></select>
        <div class="msg-error" hidden></div>
      </div>
      <div class="campo" id="campo-rol">
        <label for="u-rol">Rol <span class="req">*</span></label>
        <select id="u-rol"><option value="USUARIO">Usuario</option><option value="ADMIN">Administrador</option></select>
        <div class="msg-error" hidden></div>
      </div>
      <div><button class="btn btn-pri" id="btn-crear-usuario">Crear usuario</button></div>
    </form>
  </section>

  <section class="card">
    <h2>Usuarios registrados</h2>
    <div class="tabla-wrap">
      <table class="tabla">
        <thead><tr><th>Nombre</th><th>Correo</th><th>Área</th><th>Rol</th><th>Estado</th><th>Último acceso</th><th></th></tr></thead>
        <tbody id="tabla-usuarios"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="avisos" class="avisos" aria-live="polite"></div>
<dialog id="dlg-confirmar"></dialog>

<script src="js/pagina-usuarios.js"></script>
</body>
</html>
